# Gradle を動かすコンテナ。scripts/build.sh は、ここの gradle サービスの `gradle` を
# 呼ぶ前提で書いてある (ホストで打った `gradle` がこのコンテナへ届くようにしておく)。
#
#   docker compose -f compose.agent.yaml up -d --wait

services:
  gradle:
    image: windmill-android-build
    build: .
    # up / run のたびにビルドする。固定タグのイメージを使い回すと、Dockerfile を
    # 変えても古いまま動いてしまう。変わっていなければキャッシュで済む
    pull_policy: build
    volumes:
      - .:/windmill-android
      - gradle-cache:/gradle-cache
    labels:
      polar.commands: "gradle"
      # release の署名の値。shim は許可リストにある環境変数しかコンテナへ渡さない
      polar.env: "WINDMILL_KEYSTORE,WINDMILL_KEYSTORE_PASSWORD,WINDMILL_KEY_ALIAS,WINDMILL_KEY_PASSWORD"
    # exec で入るだけなので、起きていればよい。rootful の docker では shim が root
    # 以外で入ってくるので、起動時 (root) にキャッシュを誰でも書けるようにしておく
    command: sh -c 'chmod 1777 /gradle-cache && exec sleep infinity'
    healthcheck:
      test: ["CMD", "test", "-f", "/windmill-android/settings.gradle.kts"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  # 依存のキャッシュとデバッグ用の署名鍵 (Dockerfile の ANDROID_USER_HOME)。
  # issue をまたいで共有する
  gradle-cache:
    name: windmill-android-gradle-cache
    external: true
